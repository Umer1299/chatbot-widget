<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatflow Embed</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: Inter, Arial, sans-serif;
    }

    #embed-loader,
    #embed-error {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      color: #111827;
      background: #f9fafb;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    #embed-error {
      color: #b91c1c;
      display: none;
    }
  </style>
</head>
<body>
  <div id="embed-loader">Loading chatbot...</div>
  <div id="embed-error"></div>

  <script>
    (function () {
      var DEFAULT_API_HOST = "https://chatflowai.io";
      var DEFAULT_STREAM_URL = "https://chatbot-backend-w1ju.onrender.com/api/chat?stream=true";
      var params = new URLSearchParams(window.location.search);
      var initialBotId = getParam(["botId", "botID", "bot_id", "bot"]);
      var chatId = getParam(["chatID", "chatId", "chat_id", "chat"]);
      var loader = document.getElementById("embed-loader");
      var errorBox = document.getElementById("embed-error");
      var iframeMode = getParam(["iframeMode", "iframe", "embedMode"]) !== "false";

      function getParam(names) {
        for (var i = 0; i < names.length; i += 1) {
          var value = params.get(names[i]);
          if (value !== null && String(value).trim() !== "") return String(value).trim();
        }
        return "";
      }

      function isTestVersionValue(value) {
        if (typeof value === "boolean") return value;
        var normalized = String(value || "").toLowerCase().trim();
        return normalized === "test" || normalized === "version-test" || normalized === "development" || normalized === "dev" || normalized === "true" || normalized === "1" || normalized === "yes";
      }

      function getVersionedApiHost(apiHost, isTestVersion) {
        var host = String(apiHost || DEFAULT_API_HOST).replace(/\/$/, "");
        if (isTestVersionValue(isTestVersion)) return /\/version-test$/i.test(host) ? host : host + "/version-test";
        return host.replace(/\/version-test$/i, "");
      }

      function getBubbleVersion() {
        return getParam(["bubbleVersion", "version", "env", "mode", "bubbleEnv"]);
      }

      function getApiHost() {
        return getParam(["apiHost", "api_host", "dataApiHost"]) || DEFAULT_API_HOST;
      }

      function normalizeConfigResponse(data) {
        return (data && data.response) || data || {};
      }

      function firstValue(source, names) {
        if (!source) return "";
        for (var i = 0; i < names.length; i += 1) {
          var value = source[names[i]];
          if (value !== undefined && value !== null && String(value).trim() !== "") return String(value).trim();
        }
        return "";
      }

      function showError(message) {
        if (loader) loader.style.display = "none";
        if (errorBox) {
          errorBox.textContent = message;
          errorBox.style.display = "flex";
        }
      }

      function getBubbleConfig() {
        if (!chatId) return Promise.resolve({});

        var apiHost = getVersionedApiHost(getApiHost(), getBubbleVersion());
        var url = apiHost + "/api/1.1/wf/get-chatbot?chatID=" + encodeURIComponent(chatId);

        return fetch(url, { method: "GET" })
          .then(function (response) {
            if (!response.ok) throw new Error("Bubble config request failed");
            return response.json();
          })
          .then(normalizeConfigResponse)
          .catch(function (error) {
            if (window.console && console.warn) console.warn("Unable to load Bubble config by chatID. Falling back to URL params.", error);
            return {};
          });
      }

      function bootstrapWidget(remoteConfig) {
        var resolvedBotId = initialBotId || firstValue(remoteConfig, ["botId", "botID", "bot_id", "bot"]);
        var resolvedChatId = chatId || firstValue(remoteConfig, ["chatID", "chatId", "chat_id", "chat"]);
        var resolvedToken = getParam(["token", "chatbotToken", "widgetToken", "chatbot_token"]) || firstValue(remoteConfig, ["chatbotToken", "chatbot_token", "widgetToken", "token"]);
        var resolvedStreamUrl = getParam(["streamApiUrl", "stream_api_url", "chatApiUrl"]) || firstValue(remoteConfig, ["streamApiUrl", "stream_api_url", "streamURL", "streamUrl", "chatApiUrl", "chat_api_url"]) || DEFAULT_STREAM_URL;

        if (!resolvedBotId) {
          showError("Bot ID missing. Add ?botId=YOUR_BOT_ID or provide a valid ?chatID=YOUR_CHAT_ID that returns botId from Bubble.");
          return;
        }

        var script = document.createElement("script");
        script.src = getParam(["widgetSrc", "scriptSrc"]) || "./chatbot-widget.js";
        script.async = true;
        script.setAttribute("data-bot-id", resolvedBotId);
        if (resolvedChatId) script.setAttribute("data-chat-id", resolvedChatId);
        script.setAttribute("data-api-host", getApiHost());
        script.setAttribute("data-stream-api-url", resolvedStreamUrl);
        if (resolvedToken) script.setAttribute("data-chatbot-token", resolvedToken);

        var bubbleVersion = getBubbleVersion();
        if (bubbleVersion) script.setAttribute("data-bubble-version", bubbleVersion);

        copyParamToData(script, ["position"], "data-position");

        var themeConfig = getParam(["themeConfig", "theme_config"]);
        if (!themeConfig) {
          var generatedThemeConfig = {
            autoOpen: iframeMode,
            title: firstValue(remoteConfig, ["name", "title", "businessName", "business_name"]),
            primaryColor: firstValue(remoteConfig, ["primaryColor", "primary_color"]),
            welcomeMessage: firstValue(remoteConfig, ["welcomeMessage", "welcome_message"]),
            inputPlaceholder: firstValue(remoteConfig, ["inputPlaceholder", "input_placeholder"]),
            iconUrl: firstValue(remoteConfig, ["iconUrl", "iconURL", "icon", "avatar", "chatIcon", "launcherIcon"]),
            brandingName: firstValue(remoteConfig, ["brandingName", "brandingText", "brandName"]),
            brandingUrl: firstValue(remoteConfig, ["brandingUrl", "brandUrl"])
          };

          var starterPrompts = remoteConfig && remoteConfig.starterPrompts;
          if (starterPrompts === undefined) starterPrompts = remoteConfig && remoteConfig.starter_prompts;
          if (starterPrompts !== undefined) generatedThemeConfig.starterPrompts = starterPrompts;

          themeConfig = JSON.stringify(generatedThemeConfig);
        }
        script.setAttribute("data-theme-config", themeConfig);

        function copyParamToData(targetScript, paramNames, dataName) {
          var value = getParam(paramNames);
          if (value) targetScript.setAttribute(dataName, value);
        }

        script.onload = function () {
          waitForWidgetHost(resolvedBotId);
        };

        script.onerror = function () {
          showError("Unable to load chatbot-widget.js.");
        };

        document.body.appendChild(script);
      }

      function waitForWidgetHost(botId) {
        var attempts = 0;
        var maxAttempts = 80;
        var timer = window.setInterval(function () {
          attempts += 1;
          var host = document.getElementById("chatbot-widget-host-" + botId);
          if (host && host.shadowRoot) {
            window.clearInterval(timer);
            if (loader) loader.style.display = "none";
            if (iframeMode) forceIframeLayout(host);
          } else if (attempts >= maxAttempts) {
            window.clearInterval(timer);
            showError("Chatbot loaded, but the widget host was not created. Check botId, chatID, and token settings.");
          }
        }, 100);
      }

      function forceIframeLayout(host) {
        var root = host.shadowRoot;
        if (!root) return;

        var style = document.createElement("style");
        style.setAttribute("data-index-iframe-layout", "true");
        style.textContent = [
          ":host{all:initial!important}",
          ".widget-root{position:fixed!important;inset:0!important;left:0!important;right:0!important;bottom:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;display:flex!important;align-items:stretch!important;gap:0!important;pointer-events:auto!important}",
          ".widget-root[data-position='left']{left:0!important;right:0!important;align-items:stretch!important}",
          ".panel{display:flex!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;border-radius:0!important;border:none!important;box-shadow:none!important}",
          ".launcher{display:none!important}",
          ".header [data-role='close-btn']{display:none!important}",
          ".chat-container{height:100vh!important;min-height:0!important}",
          "@media(max-width:767px){.widget-root[data-open='true'] .panel{position:static!important;width:100vw!important;height:100vh!important}}"
        ].join("\n");
        root.appendChild(style);

        function keepOpen() {
          var widgetRoot = root.querySelector(".widget-root");
          if (widgetRoot) widgetRoot.setAttribute("data-open", "true");
        }

        keepOpen();
        window.setTimeout(keepOpen, 250);
        window.setTimeout(keepOpen, 750);
        window.setInterval(keepOpen, 1500);
      }

      getBubbleConfig().then(bootstrapWidget);
    })();
  </script>
</body>
</html>

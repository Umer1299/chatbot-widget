<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatflow Embed</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --chatflow-primary: #2563eb;
      --chatflow-bg: #ffffff;
      --chatflow-text: #111827;
      --chatflow-muted: #64748b;
      --chatflow-border: #e5e7eb;
      --chatflow-soft: #f8fafc;
      --chatflow-radius: 20px;
      --chatflow-font: Inter, Arial, sans-serif;
      --chatflow-font-size: 14px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: var(--chatflow-font);
      font-size: var(--chatflow-font-size);
      color: var(--chatflow-text);
      border-radius: var(--chatflow-radius);
    }

    #embed-loader,
    #embed-error {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f9fafb;
      text-align: center;
      line-height: 1.5;
      border-radius: var(--chatflow-radius);
      z-index: 5;
      white-space: pre-wrap;
    }

    #embed-error {
      display: none;
      color: #b91c1c;
    }

    #chatflow-app {
      position: fixed;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      background: var(--chatflow-bg);
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: var(--chatflow-radius);
      overflow: hidden;
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
      background: var(--chatflow-bg);
      border-radius: var(--chatflow-radius);
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: var(--chatflow-primary);
      color: #fff;
      flex: 0 0 auto;
    }

    .avatar {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      overflow: hidden;
    }

    .title {
      flex: 1;
      min-width: 0;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .clear-btn {
      width: 32px;
      height: 32px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }

    .messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      background: var(--chatflow-soft);
    }

    .message {
      display: flex;
      margin: 0 0 12px;
    }

    .message.user { justify-content: flex-end; }
    .message.bot { justify-content: flex-start; }

    .bubble {
      max-width: 84%;
      padding: 10px 12px;
      border-radius: 16px;
      line-height: 1.45;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    .message.user .bubble {
      background: var(--chatflow-primary);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .message.bot .bubble {
      background: #fff;
      color: var(--chatflow-text);
      border-bottom-left-radius: 6px;
    }

    .bubble p { margin: 0 0 8px; }
    .bubble p:last-child { margin-bottom: 0; }

    .typing span {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 2px;
      border-radius: 999px;
      background: #94a3b8;
      animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    .prompts {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--chatflow-border);
      background: #fff;
      flex: 0 0 auto;
    }

    .prompts[data-visible="true"] { display: flex; }

    .prompt {
      border: 1px solid #dbeafe;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 999px;
      padding: 7px 10px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    .composer {
      position: relative;
      display: block;
      flex: 0 0 auto;
      margin: 6px 12px 8px;
      padding: 8px 50px 8px 14px;
      border-radius: 24px;
      background: #fff;
      box-shadow: inset 0 0 0 1px #d1d5db;
      overflow: visible;
    }

    .composer textarea {
      display: block;
      width: 100%;
      height: 24px;
      min-height: 24px;
      max-height: 118px;
      padding: 0;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      font: inherit;
      line-height: 1.35;
      color: var(--chatflow-text);
    }

    .send-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      min-width: 28px;
      border: 0;
      border-radius: 999px;
      background: var(--chatflow-primary);
      color: #fff;
      cursor: pointer;
      font-weight: 800;
      line-height: 1;
    }

    .send-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .branding {
      display: none;
      padding: 6px 12px 8px;
      text-align: center;
      font-size: 10px;
      color: #9ca3af;
      background: #fff;
      flex: 0 0 auto;
    }

    .branding[data-visible="true"] { display: block; }
    .branding a { color: #9ca3af; text-decoration: none; }
    .branding strong { color: #0949c7; }

    @media (max-width: 767px) {
      :root { --chatflow-radius: 16px; }
      .chat-header { padding: 12px 14px; }
      .avatar { width: 40px; height: 40px; min-width: 40px; }
      .title { font-size: 17px; }
      .messages { padding: 14px; }
      .composer { margin: 6px 10px 8px; padding: 8px 48px 8px 13px; }
      .send-btn { right: 9px; }
    }
  </style>
</head>
<body>
  <div id="embed-loader">Loading chatbot data...</div>
  <div id="embed-error"></div>

  <div id="chatflow-app" aria-live="polite">
    <div class="chat-panel">
      <div class="chat-header">
        <div class="avatar" id="avatar"></div>
        <div class="title" id="title">Chat Assistant</div>
        <button class="clear-btn" id="clear-btn" type="button" aria-label="Reset chat" title="Reset chat">↻</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="prompts" id="prompts"></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message..."></textarea>
        <button class="send-btn" id="send-btn" type="button" aria-label="Send">↑</button>
      </div>
      <div class="branding" id="branding"><a id="branding-link" target="_blank" rel="noopener noreferrer"></a></div>
    </div>
  </div>

  <script>
    (function () {
      var DEFAULT_API_HOST = "https://chatflowai.io";
      var DEFAULT_STREAM_URL = "https://chatbot-backend-w1ju.onrender.com/api/chat?stream=true";
      var REQUEST_TIMEOUT_MS = 60000;
      var params = new URLSearchParams(window.location.search || "");

      var loader = document.getElementById("embed-loader");
      var errorBox = document.getElementById("embed-error");
      var app = document.getElementById("chatflow-app");
      var avatar = document.getElementById("avatar");
      var title = document.getElementById("title");
      var messagesEl = document.getElementById("messages");
      var promptsEl = document.getElementById("prompts");
      var input = document.getElementById("input");
      var sendBtn = document.getElementById("send-btn");
      var clearBtn = document.getElementById("clear-btn");
      var branding = document.getElementById("branding");
      var brandingLink = document.getElementById("branding-link");

      var state = {
        botId: getParam(["botId", "botID", "bot_id", "bot", "chatbotId", "chatbot_id", "data-bot-id"]),
        chatId: getParam(["chatID", "chatId", "chat_id", "chat", "data-chat-id"]),
        token: getParam(["chatbotToken", "chatbot_token", "widgetToken", "widget_token", "token", "data-token", "data-widget-token", "data-chatbot-token"]),
        apiHost: getParam(["apiHost", "api_host", "data-api-host", "dataApiHost"]) || DEFAULT_API_HOST,
        bubbleVersion: resolveBubbleVersion(),
        streamApiUrl: getParam(["streamApiUrl", "stream_api_url", "chatApiUrl", "chat_api_url", "data-stream-api-url"]) || DEFAULT_STREAM_URL,
        sessionId: "",
        history: [],
        config: null,
        configUrl: "",
        hasStarted: false,
        isLoading: false
      };

      function getParam(names) {
        for (var i = 0; i < names.length; i += 1) {
          var value = params.get(names[i]);
          if (value !== null && String(value).trim() !== "") return String(value).trim();
        }
        return "";
      }

      function normalizeBubbleVersion(value) {
        var raw = String(value || "").trim();
        if (!raw) return "";
        if (/^(true|1|yes|test|dev|development|version-test)$/i.test(raw)) return "test";
        if (/^(false|0|no|live|production)$/i.test(raw)) return "live";
        return raw;
      }

      function resolveBubbleVersion() {
        var explicit = getParam(["bubbleVersion", "bubble_version", "data-bubble-version", "version", "env", "mode", "bubbleEnv", "bubble_env"]);
        if (explicit) return normalizeBubbleVersion(explicit);
        var testFlag = getParam(["test", "isTestVersion", "is_test_version", "development", "dev"]);
        if (/^(true|1|yes|test|dev|development|version-test)$/i.test(testFlag)) return "test";
        var referrer = String(document.referrer || "").toLowerCase();
        if (referrer.indexOf("version-test") !== -1 || referrer.indexOf("debug_mode=true") !== -1) return "test";
        return "live";
      }

      function isTestVersion(value) {
        return /^(test|version-test|dev|development|true|1|yes)$/i.test(String(value || "").trim());
      }

      function getVersionedApiHost() {
        var host = String(state.apiHost || DEFAULT_API_HOST).replace(/\/+$/, "");
        if (isTestVersion(state.bubbleVersion)) return /\/version-test$/i.test(host) ? host : host + "/version-test";
        return host.replace(/\/version-test$/i, "");
      }

      function getSessionKey() {
        return "chatflow-iframe-session:" + (state.chatId || state.botId || "default");
      }

      function createUid() {
        return window.crypto && crypto.randomUUID ? crypto.randomUUID() : "cw_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
      }

      function getSessionId() {
        try {
          var existing = localStorage.getItem(getSessionKey()) || "";
          if (existing) return existing;
          existing = createUid();
          localStorage.setItem(getSessionKey(), existing);
          return existing;
        } catch (error) {
          return createUid();
        }
      }

      function showError(message) {
        if (loader) loader.style.display = "none";
        if (app) app.style.display = "none";
        errorBox.textContent = message;
        errorBox.style.display = "flex";
      }

      function showApp() {
        if (loader) loader.style.display = "none";
        errorBox.style.display = "none";
        app.style.display = "block";
      }

      function setLoading(isLoading) {
        state.isLoading = !!isLoading;
        sendBtn.disabled = !!isLoading;
        input.disabled = !!isLoading;
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderMarkdown(text) {
        var source = String(text || "");
        if (window.marked && typeof window.marked.parse === "function") return window.marked.parse(source);
        return "<p>" + escapeHtml(source).replace(/\n/g, "<br>") + "</p>";
      }

      function parseJson(value, fallback) {
        if (!value) return fallback;
        if (typeof value !== "string") return value;
        try { return JSON.parse(value); } catch (error) { return fallback; }
      }

      function toBoolean(value, fallback) {
        if (typeof value === "boolean") return value;
        if (typeof value === "string") {
          var normalized = value.toLowerCase().trim();
          if (normalized === "true" || normalized === "1" || normalized === "yes") return true;
          if (normalized === "false" || normalized === "0" || normalized === "no") return false;
        }
        return typeof fallback === "boolean" ? fallback : false;
      }

      function normalizeFontSize(value, fallback) {
        if (typeof value === "number" && !isNaN(value)) return value + "px";
        if (typeof value === "string" && value.trim()) return /^\d+(?:\.\d+)?$/.test(value.trim()) ? value.trim() + "px" : value.trim();
        return fallback;
      }

      function normalizeIconUrl(url) {
        var raw = String(url || "").trim();
        if (!raw) return "";
        if (raw.indexOf("data:") === 0 || raw.indexOf("blob:") === 0) return raw;
        if (/^https?:\/\//i.test(raw)) return encodeURI(raw);
        if (/^\/\//.test(raw) && window.location && window.location.protocol) return window.location.protocol + raw;
        if (/^\//.test(raw)) return getVersionedApiHost() + raw;
        return getVersionedApiHost() + "/" + raw.replace(/^\/+/, "");
      }

      function requestWithTimeout(url, options, timeoutMs) {
        var controller = window.AbortController ? new AbortController() : null;
        var timeoutId = null;
        var requestOptions = options || {};
        if (controller) requestOptions.signal = controller.signal;

        return new Promise(function (resolve, reject) {
          timeoutId = setTimeout(function () {
            if (controller) controller.abort();
            reject(new Error("Request timed out"));
          }, timeoutMs || REQUEST_TIMEOUT_MS);

          fetch(url, requestOptions).then(function (response) {
            clearTimeout(timeoutId);
            resolve(response);
          }).catch(function (error) {
            clearTimeout(timeoutId);
            reject(error);
          });
        });
      }

      function getResponseConfig(data) {
        return data && typeof data === "object" && data.response && typeof data.response === "object" ? data.response : data;
      }

      function hasUsefulConfig(data) {
        var config = getResponseConfig(data);
        if (!config || typeof config !== "object") return false;
        return !!(
          config.name ||
          config.primaryColor ||
          config.welcomeMessage ||
          config.starterPrompts ||
          config.chatbotToken ||
          config.chatbot_token ||
          config.widgetToken ||
          config.token ||
          config.iconUrl ||
          config.iconURL ||
          config.icon ||
          config.avatar
        );
      }

      function buildConfigUrl(paramName) {
        return getVersionedApiHost() + "/api/1.1/wf/get-chatbot?" + encodeURIComponent(paramName) + "=" + encodeURIComponent(state.botId) + "&cf_iframe_cache=" + Date.now();
      }

      function fetchConfigCandidate(paramName) {
        var url = buildConfigUrl(paramName);
        return requestWithTimeout(url, { method: "GET", headers: { "Accept": "application/json" }, cache: "no-store" }, REQUEST_TIMEOUT_MS)
          .then(function (response) {
            if (!response.ok) throw new Error("HTTP " + response.status + " from " + url);
            return response.json().then(function (data) {
              return { paramName: paramName, url: url, data: data, useful: hasUsefulConfig(data) };
            });
          });
      }

      function loadConfig() {
        var paramNames = ["botId", "chatID", "chatId", "bot_id", "id"];
        var errors = [];
        var index = 0;

        function next() {
          if (index >= paramNames.length) {
            throw new Error("No chatbot config found for this ID. Tried: " + errors.join(" | "));
          }
          var paramName = paramNames[index++];
          return fetchConfigCandidate(paramName).then(function (result) {
            if (result.useful) return result;
            errors.push(result.url + " returned empty config");
            return next();
          }).catch(function (error) {
            errors.push(error && error.message ? error.message : String(error || "unknown error"));
            return next();
          });
        }

        return next();
      }

      function normalizeConfig(remoteData) {
        var remote = getResponseConfig(remoteData) || {};
        var themeConfig = parseJson(remote.themeConfig || remote.theme_config || {}, {});
        var prompts = remote.starterPrompts || remote.starter_prompts || remote.prompts || themeConfig.starterPrompts || [];
        prompts = parseJson(prompts, prompts);
        if (!Array.isArray(prompts)) prompts = [];

        return {
          name: remote.name || remote.title || themeConfig.title || "Chat Assistant",
          primaryColor: remote.primaryColor || remote.primary_color || themeConfig.primaryColor || "#2563eb",
          welcomeMessage: remote.welcomeMessage || remote.welcome_message || themeConfig.welcomeMessage || "Hi! How can I help you today?",
          starterPrompts: prompts,
          inputPlaceholder: remote.inputPlaceholder || remote.input_placeholder || themeConfig.inputPlaceholder || "Message...",
          iconUrl: remote.iconUrl || remote.iconURL || remote.icon || remote.avatar || remote.chatIcon || remote.launcherIcon || themeConfig.iconUrl || themeConfig.icon || "",
          showBranding: toBoolean(remote.showBranding, toBoolean(themeConfig.showBranding, false)),
          brandingText: remote.brandingName || remote.brandingText || remote.brandName || themeConfig.brandingName || themeConfig.brandingText || "Chatflow AI",
          brandingUrl: remote.brandingUrl || remote.brandUrl || themeConfig.brandingUrl || themeConfig.brandUrl || "https://chatflowai.io",
          theme: String(remote.theme || themeConfig.theme || "light").toLowerCase() === "dark" ? "dark" : "light",
          fontFamily: remote.fontFamily || remote.font_family || themeConfig.fontFamily || "Inter, Arial, sans-serif",
          fontSize: normalizeFontSize(remote.fontSize || remote.font_size || themeConfig.fontSize, "14px"),
          botId: remote.botId || remote.botID || remote.bot_id || remote.bot || state.botId,
          chatId: remote.chatID || remote.chatId || remote.chat_id || remote.chat || state.chatId || state.botId,
          userId: remote.userId || remote.user_id || remote.userid || remote.user || "",
          aiModel: remote.aiModel || remote.ai_model || remote.model || "gpt-4o-mini",
          chatbotToken: remote.chatbotToken || remote.chatbot_token || remote.widgetToken || remote.token || state.token || "",
          streamApiUrl: remote.streamApiUrl || remote.stream_api_url || remote.chatApiUrl || remote.chat_api_url || state.streamApiUrl
        };
      }

      function applyConfig(config) {
        state.config = config;
        state.botId = String(config.botId || state.botId || "").trim();
        state.chatId = String(config.chatId || state.chatId || state.botId || "").trim();
        state.token = String(config.chatbotToken || state.token || "").trim();
        state.streamApiUrl = config.streamApiUrl || state.streamApiUrl;
        state.sessionId = getSessionId();

        document.documentElement.style.setProperty("--chatflow-primary", config.primaryColor || "#2563eb");
        document.documentElement.style.setProperty("--chatflow-font", config.fontFamily || "Inter, Arial, sans-serif");
        document.documentElement.style.setProperty("--chatflow-font-size", config.fontSize || "14px");

        title.textContent = config.name || "Chat Assistant";
        input.placeholder = config.inputPlaceholder || "Message...";

        var iconUrl = normalizeIconUrl(config.iconUrl);
        if (iconUrl) avatar.style.backgroundImage = 'url("' + iconUrl.replace(/"/g, "%22") + '")';
        else avatar.style.backgroundImage = "none";

        if (config.showBranding && config.brandingText && config.brandingUrl) {
          branding.setAttribute("data-visible", "true");
          brandingLink.href = config.brandingUrl;
          brandingLink.innerHTML = "Powered by <strong>" + escapeHtml(config.brandingText) + "</strong>";
        } else {
          branding.setAttribute("data-visible", "false");
        }

        resetConversation(false);
        showApp();
      }

      function appendMessage(role, text, options) {
        var opts = options || {};
        var wrapper = document.createElement("div");
        wrapper.className = "message " + (role === "user" ? "user" : "bot");
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        if (role === "user") bubble.textContent = String(text || "");
        else bubble.innerHTML = opts.rawHtml ? String(text || "") : renderMarkdown(text);
        wrapper.appendChild(bubble);
        messagesEl.appendChild(wrapper);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        if (!opts.skipHistory) {
          state.history.push({ role: role === "user" ? "user" : "bot", text: String(text || "") });
          if (role === "user") state.hasStarted = true;
          renderPrompts();
        }
        return bubble;
      }

      function renderPrompts() {
        promptsEl.innerHTML = "";
        var prompts = state.config && Array.isArray(state.config.starterPrompts) ? state.config.starterPrompts : [];
        if (state.hasStarted || !prompts.length) {
          promptsEl.setAttribute("data-visible", "false");
          return;
        }
        promptsEl.setAttribute("data-visible", "true");
        prompts.slice(0, 4).forEach(function (prompt) {
          if (!prompt) return;
          var button = document.createElement("button");
          button.type = "button";
          button.className = "prompt";
          button.textContent = String(prompt);
          button.addEventListener("click", function () { sendMessage(String(prompt)); });
          promptsEl.appendChild(button);
        });
      }

      function resetConversation(keepFocus) {
        state.history = [];
        state.hasStarted = false;
        messagesEl.innerHTML = "";
        if (state.config && state.config.welcomeMessage) appendMessage("bot", state.config.welcomeMessage, { skipHistory: true });
        renderPrompts();
        if (keepFocus !== false && input && input.focus) input.focus();
      }

      function createTypingBubble() {
        return appendMessage("bot", '<div class="typing"><span></span><span></span><span></span></div>', { rawHtml: true, skipHistory: true });
      }

      function extractReplyFromJson(data) {
        return String((data && (data.reply || data.text || data.token || (data.response && (data.response.reply || data.response.text || data.response.token)))) || "").trim();
      }

      function normalizeCredits(value) {
        var n = Number(value);
        return Number.isFinite(n) && n >= 0 ? n : 0;
      }

      function getCreditsFromPayload(payload) {
        if (!payload || typeof payload !== "object") return 0;
        if (payload.creditsUsed !== undefined) return normalizeCredits(payload.creditsUsed);
        if (payload.credits !== undefined) return normalizeCredits(payload.credits);
        if (payload.usage && payload.usage.creditsUsed !== undefined) return normalizeCredits(payload.usage.creditsUsed);
        if (payload.response && payload.response.usage && payload.response.usage.creditsUsed !== undefined) return normalizeCredits(payload.response.usage.creditsUsed);
        return 0;
      }

      function parseStreamPayload(rawChunk) {
        var text = String(rawChunk || "").trim();
        if (!text) return { kind: "ignore" };
        if (text === "[DONE]") return { kind: "done" };
        var payload = parseJson(text, null);
        if (!payload) return { kind: "chunk", text: text };
        if (typeof payload === "string") return { kind: "chunk", text: payload };
        if (payload.type === "ready") return { kind: "ignore" };
        if (payload.type === "error") return { kind: "error", text: payload.message || payload.error || "Something went wrong. Please try again." };
        if (payload.type === "meta") return { kind: "meta", reply: payload.reply || "", creditsUsed: getCreditsFromPayload(payload) };
        if (payload.type === "calendly_button") return { kind: "calendly_button", label: payload.label || payload.text || "Book a time", url: payload.url || payload.link || payload.href || "" };
        if (typeof payload.reply === "string") return { kind: "meta", reply: payload.reply, creditsUsed: getCreditsFromPayload(payload) };
        if (typeof payload.token === "string") return { kind: "chunk", text: payload.token };
        if (typeof payload.text === "string") return { kind: "chunk", text: payload.text };
        return { kind: "ignore" };
      }

      function mergeStreamText(currentText, incomingPiece) {
        var base = String(currentText || "");
        var piece = String(incomingPiece || "");
        if (!piece) return base;
        if (piece.indexOf(base) === 0) return piece;
        return base + piece;
      }

      function sendStreamChatRequest(messageText, onChunk) {
        if (!state.token) return Promise.reject(new Error("Missing chatbot token"));
        var payload = {
          botId: state.botId || "",
          chatID: state.chatId || state.botId || "",
          bubbleVersion: state.bubbleVersion || "live",
          sessionId: state.sessionId || "",
          message: messageText
        };
        if (state.config && state.config.userId) payload.userId = state.config.userId;
        if (state.config && state.config.aiModel) payload.model = state.config.aiModel;

        return requestWithTimeout(state.streamApiUrl || DEFAULT_STREAM_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-chatbot-token": state.token },
          body: JSON.stringify(payload)
        }, REQUEST_TIMEOUT_MS).then(function (response) {
          if (!response.ok) throw new Error("Stream chat request failed");
          var contentType = String(response.headers && response.headers.get ? response.headers.get("content-type") || "" : "").toLowerCase();
          if (contentType.indexOf("application/json") !== -1) {
            return response.json().then(function (data) {
              var reply = extractReplyFromJson(data);
              if (reply && typeof onChunk === "function") onChunk(reply);
              return { reply: reply || "No response.", creditsUsed: getCreditsFromPayload(data) };
            });
          }
          if (!response.body || typeof response.body.getReader !== "function") throw new Error("Streaming is not supported by this browser");
          var reader = response.body.getReader();
          var decoder = new TextDecoder();
          var buffered = "";
          var streamText = "";
          var finalReply = "";
          var creditsUsed = 0;

          return new Promise(function (resolve, reject) {
            function applyPayload(payload) {
              if (!payload || payload.kind === "ignore") return false;
              if (payload.kind === "done") return true;
              if (payload.kind === "meta") {
                if (payload.reply) finalReply = payload.reply;
                if (payload.creditsUsed !== undefined) creditsUsed = normalizeCredits(payload.creditsUsed);
                return false;
              }
              if (payload.kind === "error") {
                finalReply = payload.text || "Something went wrong. Please try again.";
                if (typeof onChunk === "function") onChunk(finalReply);
                return false;
              }
              if (payload.kind === "chunk") {
                streamText = mergeStreamText(streamText, payload.text);
                if (typeof onChunk === "function") onChunk(streamText);
              }
              return false;
            }

            function finish() {
              resolve({ reply: finalReply || streamText || "No response.", creditsUsed: creditsUsed });
            }

            function readNext() {
              reader.read().then(function (result) {
                if (result.done) {
                  var remaining = buffered.trim();
                  if (remaining) applyPayload(parseStreamPayload(remaining.replace(/^data:\s*/i, "")));
                  finish();
                  return;
                }
                buffered += decoder.decode(result.value, { stream: true });
                var parts = buffered.split(/\n\n|\r\n\r\n/);
                buffered = parts.pop() || "";
                for (var i = 0; i < parts.length; i += 1) {
                  var line = parts[i].trim();
                  if (!line) continue;
                  line.split(/\r?\n/).forEach(function (entry) {
                    entry = entry.trim();
                    if (!entry) return;
                    if (entry.indexOf("data:") === 0) entry = entry.replace(/^data:\s*/i, "");
                    applyPayload(parseStreamPayload(entry));
                  });
                }
                readNext();
              }).catch(reject);
            }
            readNext();
          });
        });
      }

      function sendBubbleChatRequest(messageText) {
        var url = getVersionedApiHost() + "/api/1.1/wf/create-chat";
        var payload = {
          botId: state.botId || "",
          chatID: state.chatId || state.botId || "",
          bubbleVersion: state.bubbleVersion || "live",
          message: messageText,
          sessionId: state.sessionId || "",
          credits: 0,
          creditsUsed: 0
        };
        return requestWithTimeout(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }, REQUEST_TIMEOUT_MS).then(function (response) {
          if (!response.ok) throw new Error("Bubble chat request failed");
          return response.json().then(function (data) {
            return { reply: extractReplyFromJson(data) || "No response.", creditsUsed: getCreditsFromPayload(data) };
          });
        });
      }

      function sendMessage(textOverride) {
        if (state.isLoading) return;
        var text = String(textOverride || input.value || "").trim();
        if (!text) return;
        input.value = "";
        state.hasStarted = true;
        appendMessage("user", text);
        var botBubble = createTypingBubble();
        setLoading(true);

        sendStreamChatRequest(text, function (partial) {
          botBubble.innerHTML = renderMarkdown(partial);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }).catch(function () {
          return sendBubbleChatRequest(text);
        }).then(function (result) {
          var finalReply = String((result && result.reply) || "No response.").trim() || "No response.";
          botBubble.innerHTML = renderMarkdown(finalReply);
          state.history.push({ role: "bot", text: finalReply });
        }).catch(function (error) {
          var message = "Server error. Please try again.";
          if (error && /missing chatbot token/i.test(error.message || "")) message = "Chatbot token missing. Please check this bot config in Bubble.";
          botBubble.innerHTML = renderMarkdown(message);
          state.history.push({ role: "bot", text: message });
        }).then(function () {
          setLoading(false);
          if (input && input.focus) input.focus();
        });
      }

      function resizeInput() {
        input.style.height = "auto";
        var max = window.matchMedia && window.matchMedia("(max-width: 767px)").matches ? 112 : 118;
        input.style.height = Math.min(Math.max(input.scrollHeight || 24, 24), max) + "px";
      }

      sendBtn.addEventListener("click", function () { sendMessage(); });
      clearBtn.addEventListener("click", function () { resetConversation(true); });
      input.addEventListener("input", resizeInput);
      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      if (!state.botId) {
        showError("Bot ID missing. Use ?botId=YOUR_BOT_ID in the iframe URL.");
        return;
      }

      loadConfig().then(function (result) {
        state.configUrl = result.url;
        applyConfig(normalizeConfig(result.data));
      }).catch(function (error) {
        showError(
          "Chatbot data did not load.\n\n" +
          "Bot ID: " + state.botId + "\n" +
          "Bubble version: " + state.bubbleVersion + "\n" +
          "API host: " + getVersionedApiHost() + "\n\n" +
          "Error: " + (error && error.message ? error.message : String(error || "Unknown error")) + "\n\n" +
          "Check: bot exists in this test/live version, Bubble workflow get-chatbot is public, and CORS/API workflow is enabled."
        );
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatflow Embed</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: Inter, Arial, sans-serif;
      border-radius: 20px;
    }
    #embed-loader, #embed-error {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      color: #111827;
      background: #f9fafb;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      border-radius: 20px;
    }
    #embed-error { color: #b91c1c; display: none; }
  </style>
</head>
<body>
  <div id="embed-loader">Loading chatbot...</div>
  <div id="embed-error"></div>

  <script>
    (function () {
      var DEFAULT_API_HOST = "https://chatflowai.io";
      var DEFAULT_STREAM_URL = "https://chatbot-backend-w1ju.onrender.com/api/chat?stream=true";
      var LOCAL_WIDGET_SRC = "./chatbot-widget.js";
      var SEND_ICON = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAACXBIWXMAAA7DAAAOwwHHb6hkAAAAGXRFWHRTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3Jnm+48GgAAAItJREFUOI3N0DEOQUEUQNFHJChpbcIelHprsAbdtwaLYSsWoBeN7mjmy4SJzP8icauZl9z7khfxazD6Rm5wwrSv3NIt8iJ3i2BfkFuOmNRubnBN7x3uWWRckhe5nGZtYIl1FtmUAoO0dZvNnoH0X+GAec0t3wIlhlWlD/x/4BwRt4i49KpjilkvuZYHFKbfp+NCkccAAAAASUVORK5CYII=";
      var params = new URLSearchParams(window.location.search);
      var loader = document.getElementById("embed-loader");
      var errorBox = document.getElementById("embed-error");
      var iframeMode = getParam(["iframeMode", "iframe", "embedMode"]) !== "false";
      var retryStarted = false;
      var lastWidgetError = "";

      function getParam(names) {
        for (var i = 0; i < names.length; i += 1) {
          var value = params.get(names[i]);
          if (value !== null && String(value).trim() !== "") return String(value).trim();
        }
        return "";
      }

      function showError(message) {
        if (loader) loader.style.display = "none";
        if (errorBox) {
          errorBox.textContent = message;
          errorBox.style.display = "flex";
        }
      }

      function hideError() {
        if (errorBox) {
          errorBox.textContent = "";
          errorBox.style.display = "none";
        }
      }

      function copyParamToData(script, paramNames, dataName, fallback) {
        var value = getParam(paramNames) || fallback || "";
        if (value) script.setAttribute(dataName, value);
        return value;
      }

      function installCreateChatSaveCorsBypass() {
        if (!window.fetch || window.__chatflowCreateChatSaveCorsBypass) return;
        window.__chatflowCreateChatSaveCorsBypass = true;
        var nativeFetch = window.fetch.bind(window);

        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : (input && input.url) || "";
          var options = init || {};
          var method = String(options.method || (input && input.method) || "GET").toUpperCase();

          if (method === "POST" && url.indexOf("/api/1.1/wf/create-chat") !== -1 && options && options.body) {
            try {
              var rawBody = typeof options.body === "string" ? options.body : "";
              var payload = rawBody ? JSON.parse(rawBody) : null;

              if (payload && (payload.botMessage !== undefined || payload.userMessage !== undefined || payload.timestamp !== undefined)) {
                var formBody = new URLSearchParams();
                Object.keys(payload).forEach(function (key) {
                  if (payload[key] !== undefined && payload[key] !== null) formBody.append(key, String(payload[key]));
                });

                return nativeFetch(url, {
                  method: "POST",
                  mode: "no-cors",
                  headers: { "Content-Type": "application/x-www-form-urlencoded" },
                  body: formBody.toString()
                }).then(function () {
                  if (typeof Response === "function") return new Response("", { status: 200, statusText: "OK" });
                  return { ok: true, status: 200, json: function () { return Promise.resolve({}); } };
                });
              }
            } catch (error) {
              if (window.console && console.warn) console.warn("[chatflow-index] CORS save bypass skipped", error);
            }
          }

          return nativeFetch(input, init);
        };
      }

      installCreateChatSaveCorsBypass();

      function resolveBubbleVersion() {
        var explicit = getParam(["data-bubble-version", "bubbleVersion", "bubble_version", "version", "env", "mode", "bubbleEnv", "bubble_env", "data-env", "data-mode"]);
        if (explicit) return explicit;
        var testFlag = getParam(["test", "isTestVersion", "is_test_version", "development", "dev"]);
        if (/^(true|1|yes|test|dev|development|version-test)$/i.test(testFlag)) return "test";
        var referrer = String(document.referrer || "").toLowerCase();
        if (referrer.indexOf("version-test") !== -1 || referrer.indexOf("debug_mode=true") !== -1) return "test";
        return "";
      }

      function addCacheBust(src) {
        var clean = String(src || LOCAL_WIDGET_SRC).trim() || LOCAL_WIDGET_SRC;
        return clean + (clean.indexOf("?") === -1 ? "?" : "&") + "cf_cache=" + Date.now();
      }

      function resetWidgetGlobals() {
        try { window.__chatbotWidgetInitState = null; } catch (e) {}
        try { window.__chatbotWidgetHostState = null; } catch (e) {}
      }

      function getWidgetSource(forceLocal) {
        if (forceLocal) return addCacheBust(LOCAL_WIDGET_SRC);
        return addCacheBust(getParam(["widgetSrc", "scriptSrc"]) || LOCAL_WIDGET_SRC);
      }

      function removeLoaderScripts() {
        var scripts = document.querySelectorAll("script[data-chatflow-index-loader='true']");
        for (var i = 0; i < scripts.length; i += 1) {
          if (scripts[i] && scripts[i].parentNode) scripts[i].parentNode.removeChild(scripts[i]);
        }
      }

      function buildWidgetScript(src) {
        var script = document.createElement("script");
        script.src = src;
        script.async = false;
        script.defer = false;
        script.crossOrigin = "anonymous";
        script.setAttribute("data-chatflow-index-loader", "true");
        script.setAttribute("data-bot-id", botId);
        copyParamToData(script, ["data-chat-id", "chatID", "chatId", "chat_id", "chat"], "data-chat-id");
        copyParamToData(script, ["data-api-host", "apiHost", "api_host", "dataApiHost"], "data-api-host", DEFAULT_API_HOST);
        copyParamToData(script, ["data-chatbot-token", "chatbotToken", "chatbot_token", "widgetToken", "widget_token", "token", "data-token", "data-widget-token"], "data-chatbot-token", chatbotToken);
        copyParamToData(script, ["data-stream-api-url", "streamApiUrl", "stream_api_url", "chatApiUrl", "chat_api_url"], "data-stream-api-url", DEFAULT_STREAM_URL);
        copyParamToData(script, ["data-position", "position"], "data-position");
        var bubbleVersion = resolveBubbleVersion();
        if (bubbleVersion) script.setAttribute("data-bubble-version", bubbleVersion);
        var themeConfig = getParam(["data-theme-config", "themeConfig", "theme_config"]);
        if (themeConfig) script.setAttribute("data-theme-config", themeConfig);
        else if (iframeMode) script.setAttribute("data-theme-config", JSON.stringify({ autoOpen: true }));
        script.onload = function () { waitForWidgetHost(botId); };
        script.onerror = function () {
          lastWidgetError = "Unable to load chatbot-widget.js from " + src;
          if (!retryStarted) retryWithLocalWidget();
          else showError(lastWidgetError);
        };
        return script;
      }

      function loadWidget(forceLocal) {
        hideError();
        resetWidgetGlobals();
        removeLoaderScripts();
        document.body.appendChild(buildWidgetScript(getWidgetSource(forceLocal)));
      }

      function retryWithLocalWidget() {
        if (retryStarted) return;
        retryStarted = true;
        if (loader) loader.textContent = "Loading chatbot...";
        loadWidget(true);
      }

      window.addEventListener("error", function (event) {
        var filename = String((event && event.filename) || "");
        if (filename.indexOf("chatbot-widget.js") !== -1) {
          lastWidgetError = String((event && event.message) || "Widget JavaScript error");
          if (window.console && console.error) console.error("[chatflow-index] widget script error:", event.error || event.message || event);
        }
      });

      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        var message = reason && reason.message ? reason.message : String(reason || "Unhandled widget promise rejection");
        if (/chatbot|widget|shadowRoot|data-bot-id|botId/i.test(message)) {
          lastWidgetError = message;
          if (window.console && console.error) console.error("[chatflow-index] widget promise error:", reason || event);
        }
      });

      var botId = getParam(["data-bot-id", "botId", "botID", "bot_id", "bot", "chatbotId", "chatbot_id"]);
      var chatbotToken = getParam(["data-chatbot-token", "chatbotToken", "chatbot_token", "widgetToken", "widget_token", "token", "data-token", "data-widget-token"]);

      if (!botId) {
        showError("Bot ID missing. Use ?botId=YOUR_BOT_ID in the index.html URL.");
        return;
      }

      loadWidget(false);

      function waitForWidgetHost(currentBotId) {
        var attempts = 0;
        var timer = window.setInterval(function () {
          attempts += 1;
          var host = document.getElementById("chatbot-widget-host-" + currentBotId);
          if (host && host.shadowRoot) {
            window.clearInterval(timer);
            if (loader) loader.style.display = "none";
            if (iframeMode) forceIframeLayout(host);
          } else if (attempts >= 120) {
            window.clearInterval(timer);
            if (!retryStarted) {
              retryWithLocalWidget();
              return;
            }
            if (window.console && console.warn) console.warn("[chatflow-index] Widget host was not created", {
              botId: currentBotId,
              initState: window.__chatbotWidgetInitState,
              lastWidgetError: lastWidgetError
            });
            showError("Chatbot loaded, but the widget host was not created." + (lastWidgetError ? " Error: " + lastWidgetError : "") + " Check botId and chatbotToken.");
          }
        }, 100);
      }

      function getPrimaryColor(root) {
        if (!root) return "";
        var widgetRoot = root.querySelector(".widget-root");
        if (widgetRoot && window.getComputedStyle) {
          var cssValue = window.getComputedStyle(widgetRoot).getPropertyValue("--chatbot-primary");
          if (cssValue && cssValue.trim()) return cssValue.trim();
        }
        var header = root.querySelector(".chat-header");
        if (header && window.getComputedStyle) {
          var bg = window.getComputedStyle(header).backgroundColor;
          if (bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent") return bg;
        }
        return "";
      }

      function syncPrimaryColor(host) {
        var root = host && host.shadowRoot;
        if (!root) return;
        var color = getPrimaryColor(root);
        if (!color) return;
        if (host.style.getPropertyValue("--chatflow-index-primary") !== color) host.style.setProperty("--chatflow-index-primary", color);
        var widgetRoot = root.querySelector(".widget-root");
        if (widgetRoot && widgetRoot.style.getPropertyValue("--chatflow-index-primary") !== color) widgetRoot.style.setProperty("--chatflow-index-primary", color);
      }

      function forceIframeLayout(host) {
        var root = host.shadowRoot;
        if (!root) return;
        host.style.position = "fixed";
        host.style.inset = "0";
        host.style.width = "100%";
        host.style.height = "100%";
        host.style.pointerEvents = "auto";
        host.style.borderRadius = "20px";
        host.style.overflow = "hidden";

        var existing = root.querySelector("style[data-index-iframe-layout]");
        if (existing) existing.remove();

        var style = document.createElement("style");
        style.setAttribute("data-index-iframe-layout", "true");
        style.textContent = [
          ":host{all:initial!important;position:fixed!important;inset:0!important;width:100%!important;height:100%!important;pointer-events:auto!important;border-radius:20px!important;overflow:hidden!important}",
          ".widget-root{position:fixed!important;inset:0!important;left:0!important;right:0!important;top:0!important;bottom:0!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;display:flex!important;align-items:stretch!important;justify-content:stretch!important;gap:0!important;pointer-events:auto!important;border-radius:20px!important;overflow:hidden!important;font-family:var(--chatbot-font-family,Inter,Arial,sans-serif)!important;font-size:var(--chatbot-font-size,14px)!important}",
          ".widget-root[data-position='left']{left:0!important;right:0!important;align-items:stretch!important}",
          ".chat-panel,.panel{display:flex!important;position:static!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;margin:0!important;box-sizing:border-box!important;overflow:hidden!important;border-radius:20px!important}",
          ".launcher{display:none!important}",
          ".chat-container{height:100%!important;min-height:0!important;border-radius:20px!important;overflow:hidden!important}",
          ".chat-header{position:relative!important;overflow:visible!important}",
          ".chat-header .avatar,.avatar{width:48px!important;height:48px!important;min-width:48px!important;flex:0 0 48px!important;border-radius:999px!important;background-size:contain!important;background-repeat:no-repeat!important;background-position:center!important;background-color:transparent!important;box-shadow:none!important}",
          ".chat-header .avatar img,.avatar img,.launcher img,img{background:transparent!important;background-color:transparent!important;box-shadow:none!important}",
          ".chat-header .title,.title{font-size:18px!important;font-weight:800!important;line-height:1.2!important;letter-spacing:-0.01em!important}",
          ".chat-header .clear-btn,.chat-header .close-btn{display:none!important}",
          ".messages{flex:1 1 auto!important;min-height:0!important;border-bottom:0!important}",
          ".prompts,.prompts[data-hidden='true']{display:none!important;height:0!important;min-height:0!important;max-height:0!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important}",
          ".composer{position:relative!important;display:block!important;flex:0 0 auto!important;margin:6px 12px 8px!important;padding:8px 50px 8px 14px!important;border:0!important;border-top:0!important;border-bottom:0!important;border-radius:24px!important;background:#fff!important;box-shadow:inset 0 0 0 1px #d1d5db!important;box-sizing:border-box!important;background-clip:padding-box!important;overflow:visible!important;font-family:inherit!important;font-size:inherit!important}",
          ".composer textarea{box-sizing:border-box!important;width:100%!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;outline:0!important;resize:none!important;line-height:1.35!important;display:block!important;box-shadow:none!important;font:inherit!important;font-family:inherit!important;font-size:inherit!important}",
          ".composer:not([data-multiline='true']) textarea{height:24px!important;min-height:24px!important;max-height:24px!important;overflow:hidden!important}",
          ".composer[data-multiline='true'] textarea{min-height:24px!important;max-height:118px!important;overflow-y:auto!important}",
          ".composer textarea:focus{outline:0!important;box-shadow:none!important;border:0!important}",
          ".send-btn{position:absolute!important;right:10px!important;top:50%!important;bottom:auto!important;transform:translateY(-50%)!important;box-sizing:border-box!important;width:28px!important;height:28px!important;min-width:28px!important;max-width:28px!important;padding:0!important;border:0!important;border-radius:999px!important;background:var(--chatflow-index-primary,var(--chatbot-primary,#2563eb))!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:0!important;line-height:1!important;box-shadow:none!important;text-indent:0!important;overflow:hidden!important;cursor:pointer!important}",
          ".send-btn::before{content:''!important;display:block!important;width:15px!important;height:15px!important;background-image:url('" + SEND_ICON + "')!important;background-repeat:no-repeat!important;background-position:center!important;background-size:15px 15px!important}",
          ".send-btn::after{content:none!important;display:none!important}",
          ".send-btn:disabled{opacity:.55!important;cursor:not-allowed!important}",
          ".composer[data-multiline='true'] .send-btn{top:auto!important;bottom:8px!important;transform:none!important}",
          ".branding{display:none!important;text-align:center!important;padding:8px 12px!important;font-size:12px!important;border-top:0!important;border-bottom:0!important;background:#fff!important;font-family:inherit!important;box-shadow:none!important}",
          ".branding[data-visible='true']{display:block!important}",
          ".branding a{color:#64748b!important;text-decoration:none!important;font-weight:400!important}",
          ".branding a .chatflow-brand-text{color:#0949c7!important;font-weight:800!important}",
          ".widget-root[data-theme='dark'] .composer{background:#111827!important;color:#f9fafb!important;box-shadow:inset 0 0 0 1px #374151!important}",
          ".widget-root[data-theme='dark'] .branding{background:#111827!important;color:#f9fafb!important}",
          ".widget-root[data-theme='dark'] .composer textarea{background:transparent!important;color:#f9fafb!important;border-color:transparent!important}",
          "@media(max-width:767px){:host{border-radius:16px!important}.widget-root{border-radius:16px!important}.chat-panel,.panel,.chat-container{border-radius:16px!important}.chat-header .avatar,.avatar{width:44px!important;height:44px!important;min-width:44px!important;flex-basis:44px!important}.chat-header .title,.title{font-size:17px!important;font-weight:800!important;line-height:1.2!important}.composer{margin:6px 10px 8px!important;padding:8px 48px 8px 13px!important;border-radius:23px!important}.composer:not([data-multiline='true']) textarea{height:22px!important;min-height:22px!important;max-height:22px!important}.composer[data-multiline='true'] textarea{min-height:22px!important;max-height:112px!important;overflow-y:auto!important}.send-btn{right:9px!important;top:50%!important;bottom:auto!important;width:28px!important;height:28px!important;min-width:28px!important;max-width:28px!important}.send-btn::before{width:14px!important;height:14px!important;background-size:14px 14px!important}.composer[data-multiline='true'] .send-btn{top:auto!important;bottom:8px!important;transform:none!important}}",
          "@media(max-width:420px){:host{border-radius:14px!important}.widget-root{border-radius:14px!important}.chat-panel,.panel,.chat-container{border-radius:14px!important}.chat-header .title,.title{font-size:16px!important}.composer{margin:6px 8px 7px!important;padding:7px 44px 7px 12px!important;border-radius:22px!important}.composer:not([data-multiline='true']) textarea{height:22px!important;min-height:22px!important;max-height:22px!important}.composer[data-multiline='true'] textarea{min-height:22px!important;max-height:108px!important;overflow-y:auto!important}.send-btn{right:8px!important;top:50%!important;bottom:auto!important;width:26px!important;height:26px!important;min-width:26px!important;max-width:26px!important}.send-btn::before{width:13px!important;height:13px!important;background-size:13px 13px!important}.composer[data-multiline='true'] .send-btn{top:auto!important;bottom:7px!important;transform:none!important}}"
        ].join("\n");
        root.appendChild(style);

        function styleBrandingText() {
          var link = root.querySelector(".branding a");
          if (!link || link.querySelector(".chatflow-brand-text")) return;
          var text = link.textContent || "";
          var match = text.match(/Chatflow AI/i);
          if (!match) return;
          var start = match.index;
          var end = start + match[0].length;
          link.textContent = "";
          if (start > 0) link.appendChild(document.createTextNode(text.slice(0, start)));
          var brandSpan = document.createElement("span");
          brandSpan.className = "chatflow-brand-text";
          brandSpan.textContent = text.slice(start, end);
          link.appendChild(brandSpan);
          if (end < text.length) link.appendChild(document.createTextNode(text.slice(end)));
        }

        function getDefaultTextareaHeight() {
          if (window.matchMedia && window.matchMedia("(max-width:767px)").matches) return 22;
          return 24;
        }

        function getMaxTextareaHeight() {
          if (window.matchMedia && window.matchMedia("(max-width:420px)").matches) return 108;
          if (window.matchMedia && window.matchMedia("(max-width:767px)").matches) return 112;
          return 118;
        }

        function resizeComposerInput() {
          var composer = root.querySelector(".composer");
          var textarea = root.querySelector(".composer textarea");
          if (!composer || !textarea) return;

          var defaultHeight = getDefaultTextareaHeight();
          var maxHeight = getMaxTextareaHeight();
          var value = textarea.value || "";

          textarea.style.setProperty("height", "auto", "important");
          var measuredHeight = textarea.scrollHeight || defaultHeight;
          var nextHeight = Math.max(defaultHeight, Math.min(measuredHeight, maxHeight));
          var isMultiline = value.indexOf("\n") !== -1 || measuredHeight > defaultHeight + 3;

          if (isMultiline) {
            composer.setAttribute("data-multiline", "true");
          } else {
            composer.removeAttribute("data-multiline");
            nextHeight = defaultHeight;
          }

          textarea.style.setProperty("height", nextHeight + "px", "important");
          textarea.style.setProperty("min-height", defaultHeight + "px", "important");
          textarea.style.setProperty("max-height", maxHeight + "px", "important");
          textarea.style.setProperty("overflow-y", isMultiline && measuredHeight >= maxHeight ? "auto" : "hidden", "important");
        }

        function alignSendButton() {
          var composer = root.querySelector(".composer");
          var sendBtn = root.querySelector(".send-btn");
          if (!composer || !sendBtn) return;
          sendBtn.style.setProperty("background", "var(--chatflow-index-primary,var(--chatbot-primary,#2563eb))", "important");
          sendBtn.style.setProperty("right", window.matchMedia && window.matchMedia("(max-width:420px)").matches ? "8px" : window.matchMedia && window.matchMedia("(max-width:767px)").matches ? "9px" : "10px", "important");
          if (composer.getAttribute("data-multiline") === "true") {
            sendBtn.style.setProperty("top", "auto", "important");
            sendBtn.style.setProperty("bottom", window.matchMedia && window.matchMedia("(max-width:420px)").matches ? "7px" : "8px", "important");
            sendBtn.style.setProperty("transform", "none", "important");
          } else {
            sendBtn.style.setProperty("top", "50%", "important");
            sendBtn.style.setProperty("bottom", "auto", "important");
            sendBtn.style.setProperty("transform", "translateY(-50%)", "important");
          }
        }

        function applyStableLayout() {
          var widgetRoot = root.querySelector(".widget-root");
          if (widgetRoot && widgetRoot.getAttribute("data-open") !== "true") widgetRoot.setAttribute("data-open", "true");
          syncPrimaryColor(host);
          styleBrandingText();
          resizeComposerInput();
          alignSendButton();
        }

        var scheduled = false;
        function scheduleStableLayout() {
          if (scheduled) return;
          scheduled = true;
          var run = function () {
            scheduled = false;
            applyStableLayout();
          };
          if (window.requestAnimationFrame) window.requestAnimationFrame(run);
          else window.setTimeout(run, 50);
        }

        applyStableLayout();
        window.setTimeout(scheduleStableLayout, 250);
        window.setTimeout(scheduleStableLayout, 1000);

        if (window.MutationObserver) {
          var observer = new MutationObserver(scheduleStableLayout);
          observer.observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-open"] });
        }

        root.addEventListener("input", scheduleStableLayout, true);
        root.addEventListener("keydown", scheduleStableLayout, true);
        root.addEventListener("keyup", scheduleStableLayout, true);
        root.addEventListener("paste", scheduleStableLayout, true);
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatflow Embed</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root{
      --chatflow-primary:#2563eb;
      --chatflow-bg:#fff;
      --chatflow-text:#111827;
      --chatflow-border:#e5e7eb;
      --chatflow-soft:#f8fafc;
      --chatflow-radius:20px;
      --chatflow-font:Inter,Arial,sans-serif;
      --chatflow-font-size:14px;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:transparent;font-family:var(--chatflow-font)!important;font-size:var(--chatflow-font-size)!important;color:var(--chatflow-text);border-radius:var(--chatflow-radius)}
    #embed-loader,#embed-error{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#f9fafb;text-align:center;line-height:1.5;border-radius:var(--chatflow-radius);z-index:5;white-space:pre-wrap;font-family:var(--chatflow-font)!important;font-size:var(--chatflow-font-size)!important}
    #embed-error{display:none;color:#b91c1c}
    #chatflow-app{position:fixed;inset:0;display:none;width:100%;height:100%;background:var(--chatflow-bg);border:1px solid rgba(15,23,42,.12);border-radius:var(--chatflow-radius);overflow:hidden}
    .chat-panel{display:flex;flex-direction:column;width:100%;height:100%;min-height:0;background:var(--chatflow-bg);border-radius:var(--chatflow-radius);overflow:hidden;font-family:var(--chatflow-font)!important;font-size:var(--chatflow-font-size)!important}
    .chat-panel,.chat-panel .messages,.chat-panel .bubble,.chat-panel .bubble *,.chat-panel .prompt,.chat-panel textarea{font-family:var(--chatflow-font)!important;font-size:var(--chatflow-font-size)!important}
    .chat-header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--chatflow-primary);color:#fff;flex:0 0 auto}
    .avatar{width:44px;height:44px;min-width:44px;border-radius:999px;background:rgba(255,255,255,.24);background-size:contain;background-repeat:no-repeat;background-position:center;overflow:hidden}
    .title{flex:1;min-width:0;font-family:var(--chatflow-font)!important;font-size:calc(var(--chatflow-font-size) + 4px)!important;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .clear-btn{width:32px;height:32px;border:0;background:transparent;color:#fff;font-size:22px;cursor:pointer;line-height:1}
    .messages{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px;background:var(--chatflow-soft)}
    .message{display:flex;margin:0 0 12px}
    .message.user{justify-content:flex-end}
    .message.bot{justify-content:flex-start}
    .bubble{max-width:84%;padding:10px 12px;border-radius:16px;line-height:1.45;word-break:break-word;box-shadow:0 1px 2px rgba(15,23,42,.08)}
    .message.user .bubble{background:var(--chatflow-primary);color:#fff;border-bottom-right-radius:6px}
    .message.bot .bubble{background:#fff;color:var(--chatflow-text);border-bottom-left-radius:6px}
    .bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}
    .typing span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:999px;background:#94a3b8;animation:blink 1.2s infinite}
    .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
    @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
    .prompts{display:none;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--chatflow-border);background:#fff;flex:0 0 auto}
    .prompts[data-visible="true"]{display:flex}
    .prompt{border:1px solid #dbeafe;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:7px 10px;cursor:pointer;font:inherit}
    .composer{position:relative;display:block;flex:0 0 auto;margin:6px 12px 8px;padding:8px 50px 8px 14px;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 1px #d1d5db;overflow:visible}
    .composer textarea{display:block;width:100%;height:24px;min-height:24px;max-height:118px;padding:0;border:0;outline:0;resize:none;background:transparent;font:inherit;line-height:1.35;color:var(--chatflow-text);overflow-y:hidden}
    .composer[data-multiline="true"] textarea{overflow-y:auto}
    .send-btn{position:absolute;right:10px;top:50%;bottom:auto;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:28px;height:28px;min-width:28px;max-width:28px;padding:0;border:0;border-radius:999px;background:var(--chatflow-primary);color:#fff;cursor:pointer;font-size:0;line-height:1;text-indent:0;box-shadow:none;overflow:hidden}
    .send-btn::before{content:'';display:block;width:17px;height:17px;background-image:url("data:image/svg+xml,%3Csvg width='18' height='18' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 19V5' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M5 12L12 5L19 12' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:center;background-size:17px 17px}
    .composer[data-multiline="true"] .send-btn{top:auto;bottom:8px;transform:none}
    .send-btn:disabled{opacity:.55;cursor:not-allowed}
    .branding{display:none;padding:6px 12px 8px;text-align:center;font-size:10px;line-height:1.05;color:#9ca3af;background:#fff;flex:0 0 auto}
    .branding[data-visible="true"]{display:block}.branding a{color:#9ca3af;text-decoration:none;font-size:10px}.branding strong{color:#0949c7;font-weight:800;font-size:10px}
    @media(max-width:767px){:root{--chatflow-radius:16px}.chat-header{padding:12px 14px}.avatar{width:40px;height:40px;min-width:40px}.title{font-size:calc(var(--chatflow-font-size) + 3px)!important}.messages{padding:14px}.composer{margin:6px 10px 8px;padding:8px 48px 8px 13px}.send-btn{right:9px}.composer[data-multiline="true"] .send-btn{bottom:8px}}
  </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatflow Embed</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: Inter, Arial, sans-serif;
    }

    #embed-loader,
    #embed-error {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      color: #111827;
      background: #f9fafb;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    #embed-error {
      color: #b91c1c;
      display: none;
    }
  </style>
</head>
<body>
  <div id="embed-loader">Loading chatbot...</div>
  <div id="embed-error"></div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var botId = getParam(["botId", "botID", "bot_id", "bot"]);
      var chatId = getParam(["chatID", "chatId", "chat_id", "chat"]);
      var loader = document.getElementById("embed-loader");
      var errorBox = document.getElementById("embed-error");
      var iframeMode = getParam(["iframeMode", "iframe", "embedMode"]) !== "false";

      function getParam(names) {
        for (var i = 0; i < names.length; i += 1) {
          var value = params.get(names[i]);
          if (value !== null && String(value).trim() !== "") return String(value).trim();
        }
        return "";
      }

      function showError(message) {
        if (loader) loader.style.display = "none";
        if (errorBox) {
          errorBox.textContent = message;
          errorBox.style.display = "flex";
        }
      }

      if (!botId) {
        showError("Bot ID missing. Add ?botId=YOUR_BOT_ID to the URL.");
        return;
      }

      var script = document.createElement("script");
      script.src = getParam(["widgetSrc", "scriptSrc"]) || "./chatbot-widget.js";
      script.async = true;
      script.setAttribute("data-bot-id", botId);

      if (chatId) script.setAttribute("data-chat-id", chatId);

      copyParamToData(["apiHost", "api_host", "dataApiHost"], "data-api-host");
      copyParamToData(["token", "chatbotToken", "widgetToken", "chatbot_token"], "data-chatbot-token");
      copyParamToData(["streamApiUrl", "stream_api_url", "chatApiUrl"], "data-stream-api-url");
      copyParamToData(["bubbleVersion", "version", "env", "mode", "bubbleEnv"], "data-bubble-version");
      copyParamToData(["position"], "data-position");

      var themeConfig = getParam(["themeConfig", "theme_config"]);
      if (themeConfig) {
        script.setAttribute("data-theme-config", themeConfig);
      } else if (iframeMode) {
        script.setAttribute("data-theme-config", JSON.stringify({ autoOpen: true }));
      }

      function copyParamToData(paramNames, dataName) {
        var value = getParam(paramNames);
        if (value) script.setAttribute(dataName, value);
      }

      script.onload = function () {
        waitForWidgetHost();
      };

      script.onerror = function () {
        showError("Unable to load chatbot-widget.js.");
      };

      document.body.appendChild(script);

      function waitForWidgetHost() {
        var attempts = 0;
        var maxAttempts = 80;
        var timer = window.setInterval(function () {
          attempts += 1;
          var host = document.getElementById("chatbot-widget-host-" + botId);
          if (host && host.shadowRoot) {
            window.clearInterval(timer);
            if (loader) loader.style.display = "none";
            if (iframeMode) forceIframeLayout(host);
          } else if (attempts >= maxAttempts) {
            window.clearInterval(timer);
            showError("Chatbot loaded, but the widget host was not created. Check botId and token settings.");
          }
        }, 100);
      }

      function forceIframeLayout(host) {
        var root = host.shadowRoot;
        if (!root) return;

        var style = document.createElement("style");
        style.setAttribute("data-index-iframe-layout", "true");
        style.textContent = [
          ":host{all:initial!important}",
          ".widget-root{position:fixed!important;inset:0!important;left:0!important;right:0!important;bottom:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;display:flex!important;align-items:stretch!important;gap:0!important;pointer-events:auto!important}",
          ".widget-root[data-position='left']{left:0!important;right:0!important;align-items:stretch!important}",
          ".panel{display:flex!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;border-radius:0!important;border:none!important;box-shadow:none!important}",
          ".launcher{display:none!important}",
          ".header [data-role='close-btn']{display:none!important}",
          ".chat-container{height:100vh!important;min-height:0!important}",
          "@media(max-width:767px){.widget-root[data-open='true'] .panel{position:static!important;width:100vw!important;height:100vh!important}}"
        ].join("\n");
        root.appendChild(style);

        function keepOpen() {
          var widgetRoot = root.querySelector(".widget-root");
          if (widgetRoot) widgetRoot.setAttribute("data-open", "true");
        }

        keepOpen();
        window.setTimeout(keepOpen, 250);
        window.setTimeout(keepOpen, 750);
        window.setInterval(keepOpen, 1500);
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatflow Embed</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: Inter, Arial, sans-serif;
      border-radius: 20px;
    }

    #embed-loader,
    #embed-error {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      color: #111827;
      background: #f9fafb;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      border-radius: 20px;
      z-index: 2147483647;
    }

    #embed-error {
      color: #b91c1c;
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="embed-loader">Loading chatbot...</div>
  <div id="embed-error"></div>

  <script>
    (function () {
      var DEFAULT_API_HOST = "https://chatflowai.io";
      var DEFAULT_STREAM_URL = "https://chatbot-backend-w1ju.onrender.com/api/chat?stream=true";
      var LOCAL_WIDGET_SRC = "./chatbot-widget.js";
      var SEND_ICON = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAACXBIWXMAAA7DAAAOwwHHb6hkAAAAGXRFWHRTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3Jnm+48GgAAAItJREFUOI3N0DEOQUEUQNFHJChpbcIelHprsAbdtwaLYSsWoBeN7mjmy4SJzP8icauZl9z7khfxazD6Rm5wwrSv3NIt8iJ3i2BfkFuOmNRubnBN7x3uWWRckhe5nGZtYIl1FtmUAoO0dZvNnoH0X+GAec0t3wIlhlWlD/x/4BwRt4i49KpjilkvuZYHFKbfp+NCkccAAAAASUVORK5CYII=";

      var params = new URLSearchParams(window.location.search || "");
      var loader = document.getElementById("embed-loader");
      var errorBox = document.getElementById("embed-error");
      var retryStarted = false;
      var lastWidgetError = "";
      var configState = {
        status: "idle",
        url: "",
        statusCode: 0,
        error: "",
        loadedAt: 0
      };

      function getParam(names) {
        for (var i = 0; i < names.length; i += 1) {
          var value = params.get(names[i]);
          if (value !== null && String(value).trim() !== "") return String(value).trim();
        }
        return "";
      }

      function normalizeBubbleVersion(value) {
        var raw = String(value || "").trim();
        if (!raw) return "";
        if (/^(true|1|yes|test|dev|development|version-test)$/i.test(raw)) return "test";
        if (/^(false|0|no|live|production)$/i.test(raw)) return "live";
        return raw;
      }

      function resolveBubbleVersion() {
        var explicit = getParam([
          "data-bubble-version",
          "bubbleVersion",
          "bubble_version",
          "version",
          "env",
          "mode",
          "bubbleEnv",
          "bubble_env",
          "data-env",
          "data-mode"
        ]);
        if (explicit) return normalizeBubbleVersion(explicit);

        var testFlag = getParam(["test", "isTestVersion", "is_test_version", "development", "dev"]);
        if (/^(true|1|yes|test|dev|development|version-test)$/i.test(testFlag)) return "test";

        var referrer = String(document.referrer || "").toLowerCase();
        if (referrer.indexOf("version-test") !== -1 || referrer.indexOf("debug_mode=true") !== -1) return "test";
        return "";
      }

      function getApiHost() {
        return (getParam(["data-api-host", "apiHost", "api_host", "dataApiHost"]) || DEFAULT_API_HOST).replace(/\/+$/, "");
      }

      function getVersionedApiHost() {
        var apiHost = getApiHost();
        var bubbleVersion = resolveBubbleVersion();
        if (/^(test|version-test|dev|development)$/i.test(bubbleVersion)) {
          return /\/version-test$/i.test(apiHost) ? apiHost : apiHost + "/version-test";
        }
        return apiHost.replace(/\/version-test$/i, "");
      }

      function getConfigUrl(botId) {
        return getVersionedApiHost() + "/api/1.1/wf/get-chatbot?botId=" + encodeURIComponent(botId);
      }

      function addCacheBust(src) {
        var clean = String(src || LOCAL_WIDGET_SRC).trim() || LOCAL_WIDGET_SRC;
        return clean + (clean.indexOf("?") === -1 ? "?" : "&") + "cf_cache=" + Date.now();
      }

      function showError(message) {
        if (loader) loader.style.display = "none";
        if (errorBox) {
          errorBox.textContent = message;
          errorBox.style.display = "flex";
        }
      }

      function hideError() {
        if (errorBox) {
          errorBox.textContent = "";
          errorBox.style.display = "none";
        }
      }

      function hideLoader() {
        if (loader) loader.style.display = "none";
      }

      function copyParamToData(script, paramNames, dataName, fallback) {
        var value = getParam(paramNames) || fallback || "";
        if (value) script.setAttribute(dataName, value);
        return value;
      }

      function isGetChatbotUrl(url) {
        return String(url || "").indexOf("/api/1.1/wf/get-chatbot") !== -1;
      }

      function extractConfigObject(data) {
        return data && typeof data === "object" && data.response && typeof data.response === "object" ? data.response : data;
      }

      function configLooksEmpty(data) {
        var config = extractConfigObject(data);
        if (!config || typeof config !== "object") return true;
        return !(
          config.name ||
          config.welcomeMessage ||
          config.primaryColor ||
          config.chatbotToken ||
          config.chatbot_token ||
          config.widgetToken ||
          config.token ||
          config.starterPrompts ||
          config.iconUrl ||
          config.iconURL ||
          config.icon
        );
      }

      function installConfigMonitor() {
        if (!window.fetch || window.__chatflowIndexConfigMonitor) return;
        window.__chatflowIndexConfigMonitor = true;
        var nativeFetch = window.fetch.bind(window);

        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : (input && input.url) || "";
          var isConfigRequest = isGetChatbotUrl(url);
          if (isConfigRequest) {
            configState.status = "loading";
            configState.url = url;
            configState.error = "";
            configState.statusCode = 0;
          }

          return nativeFetch(input, init).then(function (response) {
            if (!isConfigRequest) return response;
            configState.statusCode = response && response.status ? response.status : 0;

            if (!response || !response.ok) {
              configState.status = "failed";
              configState.error = "Config request failed" + (configState.statusCode ? " (HTTP " + configState.statusCode + ")" : "");
              return response;
            }

            if (!response.clone || typeof Response !== "function") {
              configState.status = "loaded";
              configState.loadedAt = Date.now();
              return response;
            }

            return response.clone().json().then(function (data) {
              if (configLooksEmpty(data)) {
                configState.status = "empty";
                configState.error = "Bubble returned an empty chatbot config for this botId.";
              } else {
                configState.status = "loaded";
                configState.error = "";
                configState.loadedAt = Date.now();
              }
              return response;
            }).catch(function (error) {
              configState.status = "failed";
              configState.error = "Config response was not valid JSON: " + (error && error.message ? error.message : String(error || "unknown error"));
              return response;
            });
          }).catch(function (error) {
            if (isConfigRequest) {
              configState.status = "failed";
              configState.error = error && error.message ? error.message : String(error || "Config request failed");
            }
            throw error;
          });
        };
      }

      function installCreateChatSaveCorsBypass() {
        if (!window.fetch || window.__chatflowCreateChatSaveCorsBypass) return;
        window.__chatflowCreateChatSaveCorsBypass = true;
        var nativeFetch = window.fetch.bind(window);

        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : (input && input.url) || "";
          var options = init || {};
          var method = String(options.method || (input && input.method) || "GET").toUpperCase();

          if (method === "POST" && url.indexOf("/api/1.1/wf/create-chat") !== -1 && options && options.body) {
            try {
              var rawBody = typeof options.body === "string" ? options.body : "";
              var payload = rawBody ? JSON.parse(rawBody) : null;

              if (payload && (payload.botMessage !== undefined || payload.userMessage !== undefined || payload.timestamp !== undefined)) {
                var formBody = new URLSearchParams();
                Object.keys(payload).forEach(function (key) {
                  if (payload[key] !== undefined && payload[key] !== null) formBody.append(key, String(payload[key]));
                });

                return nativeFetch(url, {
                  method: "POST",
                  mode: "no-cors",
                  headers: { "Content-Type": "application/x-www-form-urlencoded" },
                  body: formBody.toString()
                }).then(function () {
                  if (typeof Response === "function") return new Response("", { status: 200, statusText: "OK" });
                  return { ok: true, status: 200, json: function () { return Promise.resolve({}); } };
                });
              }
            } catch (error) {
              if (window.console && console.warn) console.warn("[chatflow-index] CORS save bypass skipped", error);
            }
          }

          return nativeFetch(input, init);
        };
      }

      function resetWidgetGlobals() {
        try { window.__chatbotWidgetInitState = null; } catch (e) {}
        try { window.__chatbotWidgetHostState = null; } catch (e2) {}
      }

      function removeLoaderScripts() {
        var scripts = document.querySelectorAll("script[data-chatflow-index-loader='true']");
        for (var i = 0; i < scripts.length; i += 1) {
          if (scripts[i] && scripts[i].parentNode) scripts[i].parentNode.removeChild(scripts[i]);
        }
      }

      function buildWidgetScript(src, botId, chatbotToken) {
        var script = document.createElement("script");
        script.src = src;
        script.async = false;
        script.defer = false;
        script.crossOrigin = "anonymous";
        script.setAttribute("data-chatflow-index-loader", "true");
        script.setAttribute("data-bot-id", botId);

        copyParamToData(script, ["data-chat-id", "chatID", "chatId", "chat_id", "chat"], "data-chat-id");
        copyParamToData(script, ["data-api-host", "apiHost", "api_host", "dataApiHost"], "data-api-host", getApiHost());
        copyParamToData(script, ["data-chatbot-token", "chatbotToken", "chatbot_token", "widgetToken", "widget_token", "token", "data-token", "data-widget-token"], "data-chatbot-token", chatbotToken);
        copyParamToData(script, ["data-stream-api-url", "streamApiUrl", "stream_api_url", "chatApiUrl", "chat_api_url"], "data-stream-api-url", DEFAULT_STREAM_URL);
        copyParamToData(script, ["data-position", "position"], "data-position");

        var bubbleVersion = resolveBubbleVersion();
        if (bubbleVersion) script.setAttribute("data-bubble-version", bubbleVersion);

        var themeConfig = getParam(["data-theme-config", "themeConfig", "theme_config"]);
        if (themeConfig) script.setAttribute("data-theme-config", themeConfig);
        else script.setAttribute("data-theme-config", JSON.stringify({ autoOpen: true }));

        script.onload = function () {
          waitForWidgetHost(botId);
        };
        script.onerror = function () {
          lastWidgetError = "Unable to load chatbot widget script from " + src;
          if (!retryStarted) retryWithLocalWidget(botId, chatbotToken);
          else showError(lastWidgetError);
        };
        return script;
      }

      function loadWidget(forceLocal, botId, chatbotToken) {
        hideError();
        resetWidgetGlobals();
        removeLoaderScripts();
        var widgetSource = forceLocal ? LOCAL_WIDGET_SRC : (getParam(["widgetSrc", "scriptSrc"]) || LOCAL_WIDGET_SRC);
        document.body.appendChild(buildWidgetScript(addCacheBust(widgetSource), botId, chatbotToken));
      }

      function retryWithLocalWidget(botId, chatbotToken) {
        if (retryStarted) return;
        retryStarted = true;
        if (loader) loader.textContent = "Loading chatbot...";
        loadWidget(true, botId, chatbotToken);
      }

      function getUsefulConfigError() {
        if (configState.status === "failed" || configState.status === "empty") {
          return "Chatbot frame loaded, but chatbot data did not load.\n\n" +
            "Bot ID: " + botId + "\n" +
            "Config URL: " + (configState.url || getConfigUrl(botId)) + "\n" +
            "Error: " + (configState.error || "Unknown config error") + "\n\n" +
            "Check Bubble API workflow, test/live version, CORS, and whether this bot exists in the selected version.";
        }
        return "";
      }

      function waitForWidgetHost(currentBotId) {
        var attempts = 0;
        var timer = window.setInterval(function () {
          attempts += 1;
          var host = document.getElementById("chatbot-widget-host-" + currentBotId);
          if (host && host.shadowRoot) {
            forceIframeLayout(host);

            if (configState.status === "failed" || configState.status === "empty") {
              window.clearInterval(timer);
              showError(getUsefulConfigError());
              return;
            }

            if (configState.status === "loaded" || attempts >= 50) {
              window.clearInterval(timer);
              hideLoader();
            }
          } else if (attempts >= 160) {
            window.clearInterval(timer);
            if (!retryStarted) {
              retryWithLocalWidget(currentBotId, chatbotToken);
              return;
            }
            showError("Chatbot script loaded, but the widget host was not created.\n\nBot ID: " + currentBotId + "\n" + (lastWidgetError ? "Error: " + lastWidgetError : "Check botId, widget script URL, and browser console."));
          }
        }, 100);
      }

      function getPrimaryColor(root) {
        if (!root) return "";
        var widgetRoot = root.querySelector(".widget-root");
        if (widgetRoot && window.getComputedStyle) {
          var cssValue = window.getComputedStyle(widgetRoot).getPropertyValue("--chatbot-primary");
          if (cssValue && cssValue.trim()) return cssValue.trim();
        }
        var header = root.querySelector(".chat-header");
        if (header && window.getComputedStyle) {
          var bg = window.getComputedStyle(header).backgroundColor;
          if (bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent") return bg;
        }
        return "";
      }

      function syncPrimaryColor(host) {
        var root = host && host.shadowRoot;
        if (!root) return;
        var color = getPrimaryColor(root);
        if (!color) return;
        host.style.setProperty("--chatflow-index-primary", color);
        var widgetRoot = root.querySelector(".widget-root");
        if (widgetRoot) widgetRoot.style.setProperty("--chatflow-index-primary", color);
      }

      function forceIframeLayout(host) {
        var root = host && host.shadowRoot;
        if (!root) return;

        host.style.position = "fixed";
        host.style.inset = "0";
        host.style.width = "100%";
        host.style.height = "100%";
        host.style.pointerEvents = "auto";
        host.style.borderRadius = "20px";
        host.style.overflow = "hidden";

        var existing = root.querySelector("style[data-index-iframe-layout]");
        if (!existing) {
          existing = document.createElement("style");
          existing.setAttribute("data-index-iframe-layout", "true");
          root.appendChild(existing);
        }

        existing.textContent = [
          ":host{all:initial!important;position:fixed!important;inset:0!important;width:100%!important;height:100%!important;pointer-events:auto!important;border-radius:20px!important;overflow:hidden!important}",
          ".widget-root{position:fixed!important;inset:0!important;left:0!important;right:0!important;top:0!important;bottom:0!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;display:flex!important;align-items:stretch!important;justify-content:stretch!important;gap:0!important;pointer-events:auto!important;border-radius:20px!important;overflow:hidden!important;font-family:var(--chatbot-font-family,Inter,Arial,sans-serif)!important;font-size:var(--chatbot-font-size,14px)!important}",
          ".widget-root[data-position='left']{left:0!important;right:0!important;align-items:stretch!important}",
          ".widget-root[data-open='false']{top:0!important;height:100%!important;align-items:stretch!important}",
          ".chat-panel,.panel{display:flex!important;position:static!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;margin:0!important;box-sizing:border-box!important;overflow:hidden!important;border-radius:20px!important}",
          ".launcher{display:none!important}",
          ".chat-container{height:100%!important;min-height:0!important;border-radius:20px!important;overflow:hidden!important}",
          ".messages{flex:1 1 auto!important;min-height:0!important;border-bottom:0!important}",
          ".prompts,.prompts[data-hidden='true']{display:none!important;height:0!important;min-height:0!important;max-height:0!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important}",
          ".composer{position:relative!important;display:block!important;flex:0 0 auto!important;margin:6px 12px 8px!important;padding:8px 50px 8px 14px!important;border:0!important;border-radius:24px!important;background:#fff!important;box-shadow:inset 0 0 0 1px #d1d5db!important;box-sizing:border-box!important;overflow:visible!important;font-family:inherit!important;font-size:inherit!important}",
          ".composer textarea{box-sizing:border-box!important;width:100%!important;padding:0!important;border:0!important;background:transparent!important;outline:0!important;resize:none!important;line-height:1.35!important;display:block!important;box-shadow:none!important;font:inherit!important}",
          ".send-btn{position:absolute!important;right:10px!important;top:50%!important;bottom:auto!important;transform:translateY(-50%)!important;width:28px!important;height:28px!important;min-width:28px!important;max-width:28px!important;padding:0!important;border:0!important;border-radius:999px!important;background:var(--chatflow-index-primary,var(--chatbot-primary,#2563eb))!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:0!important;line-height:1!important;box-shadow:none!important;overflow:hidden!important;cursor:pointer!important}",
          ".send-btn::before{content:''!important;display:block!important;width:15px!important;height:15px!important;background-image:url('" + SEND_ICON + "')!important;background-repeat:no-repeat!important;background-position:center!important;background-size:15px 15px!important}",
          ".send-btn::after{content:none!important;display:none!important}",
          ".branding{display:none!important}",
          "@media(max-width:767px){:host{border-radius:16px!important}.widget-root{border-radius:16px!important}.chat-panel,.panel,.chat-container{border-radius:16px!important}.composer{margin:6px 10px 8px!important;padding:8px 48px 8px 13px!important}.send-btn{right:9px!important}}"
        ].join("\n");

        var widgetRoot = root.querySelector(".widget-root");
        if (widgetRoot && widgetRoot.getAttribute("data-open") !== "true") widgetRoot.setAttribute("data-open", "true");
        syncPrimaryColor(host);
      }

      window.addEventListener("error", function (event) {
        var filename = String((event && event.filename) || "");
        if (filename.indexOf("chatbot-widget.js") !== -1) {
          lastWidgetError = String((event && event.message) || "Widget JavaScript error");
          if (window.console && console.error) console.error("[chatflow-index] widget script error:", event.error || event.message || event);
        }
      });

      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        var message = reason && reason.message ? reason.message : String(reason || "Unhandled widget promise rejection");
        if (/chatbot|widget|shadowRoot|data-bot-id|botId/i.test(message)) {
          lastWidgetError = message;
          if (window.console && console.error) console.error("[chatflow-index] widget promise error:", reason || event);
        }
      });

      installConfigMonitor();
      installCreateChatSaveCorsBypass();

      var botId = getParam(["data-bot-id", "botId", "botID", "bot_id", "bot", "chatbotId", "chatbot_id"]);
      var chatbotToken = getParam(["data-chatbot-token", "chatbotToken", "chatbot_token", "widgetToken", "widget_token", "token", "data-token", "data-widget-token"]);

      if (!botId) {
        showError("Bot ID missing. Use ?botId=YOUR_BOT_ID in the index.html URL.");
        return;
      }

      if (loader) loader.textContent = "Loading chatbot data...";
      loadWidget(false, botId, chatbotToken);
    })();
  </script>
</body>
</html>
